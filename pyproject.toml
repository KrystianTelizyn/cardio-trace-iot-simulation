[project]
name = "cardio-trace-iot-simulation"
version = "0.1.0"
description = "Cardio trace IoT heart rate simulation and RR repository"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiomqtt>=2.5.1",
    "peakutils>=1.3.5",
    "pyhrv>=0.4.1",
    "sqlalchemy>=2.0.48",
    "fastapi[standard]>=0.115.0",
    "uvicorn>=0.32.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.4.0",
    "testcontainers[mqtt]>=4.14.1",
]
