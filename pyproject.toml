[project]
name = "cardio-trace-iot-simulation"
version = "0.1.0"
description = "Cardio trace IoT heart rate simulation and RR repository"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "peakutils>=1.3.5",
    "pyhrv>=0.4.1",
    "sqlalchemy>=2.0.48",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
